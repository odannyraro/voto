name: CI

on:
  push:
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Uma falha em um sistema operacional não esconde o resultado dos outros.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      # Codecov só no Ubuntu: um upload por flag, cada um com o lcov do workspace.
      - name: Upload coverage (shared)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/shared/coverage/lcov.info
          flags: shared
          fail_ci_if_error: false

      - name: Upload coverage (domain)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/domain/coverage/lcov.info
          flags: domain
          fail_ci_if_error: false

      - name: Upload coverage (server)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/server/coverage/lcov.info
          flags: server
          fail_ci_if_error: false

      - name: Upload coverage (web)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

      # Build de produção (front e servidor), o mesmo que o Render roda. Fica depois dos uploads
      # de cobertura, para uma falha aqui não esconder a cobertura; os passos de e2e entram logo
      # abaixo dele, porque testam o build.
      - name: Build
        run: npm run build

      # Relatório do Playwright para investigar e2e que falhou (architecture §12). Enquanto o
      # workspace `e2e/` não existir, a pasta não existe e o passo não faz nada.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
